      if(!out.length){ msg("Aucune ligne à exporter sur cette période.", true); break; }
      const csv = apCsv(out, $("#ap-head").checked), n = `${out.length} ligne${out.length > 1 ? "s" : ""}`;
      if(a === "apdl"){ await saveFile("Import_CMU.csv", new Blob([csv], {type: "text/csv;charset=utf-8"})); msg(`${n} exportée${out.length > 1 ? "s" : ""}.`); break; }
      const h = await apDir(true); if(!h){ msg("Reliez d'abord le dossier d'échange (partie 1).", true); break; }
      try{ const fh = await h.getFileHandle("Import_CMU.csv", {create: true}), w = await fh.createWritable(); await w.write(csv); await w.close(); msg(`${n} écrite${out.length > 1 ? "s" : ""} dans ${h.name}\\Import_CMU.csv : lancez l'import dans API PRO.`); toast("Import_CMU.csv écrit dans " + h.name + "."); }
      catch(e){ msg("Écriture impossible dans le dossier (" + (e.message || e.name) + ").", true); }
      break;
    }
    case "apdir": {
      try{ const h = await window.showDirectoryPicker({id: "apipro", mode: "readwrite"}); await apIdb("readwrite", st => st.put(h, "dir")); toast("Dossier d'échange relié : " + h.name + "."); openApipro(); }
      catch(e){ if(!e || e.name !== "AbortError") toast("Dossier non relié (" + ((e && (e.message || e.name)) || "erreur") + ").", "late"); }
      break;
    }
    case "apread": {
      const h = await apDir(true); if(!h){ toast("Reliez d'abord le dossier d'échange.", "late"); break; }
      const f = await apLatest(h).catch(() => null);
      if(!f){ $("#ap-map").innerHTML = `<p class="lateN">Aucun export (.xlsx, .csv) d'API PRO dans ${esc(h.name)}.</p>`; break; }
      try{ S.apData = await apRead(f); apMapUI(apGuess(S.apData.head)); }catch(e){ $("#ap-map").innerHTML = `<p class="lateN">Fichier ${esc(f.name)} illisible.</p>`; }
      break;
    }
    case "appaste": {
      const d = apPasteData($("#ap-paste").value);
      if(!d){ $("#ap-map").innerHTML = `<p class="lateN">Collez au moins la ligne de titres et une ligne.</p>`; break; }
      S.apData = d; apMapUI(apGuess(d.head));
      break;
    }
    case "archview": openArchive(el.dataset.id); break;
    case "archxlsx": el.disabled = true; await archiveXlsx(el.dataset.id); el.disabled = false; break;
    case "archnow": {
      const svc = $("#arch-svc").value, id = `${YEAR}-S${String(CW).padStart(2, "0")}-${svc}-${Date.now().toString(36)}`;
      el.disabled = true; $("#arch-msg").textContent = "Archivage…";
      try{ await saveArchive(id, svc, "manuel", $("#arch-note").value.trim()); toast(`Planning archivé · ${SVC[svc].name} · S${CW}.`); }
      catch(e){ toast("Archive non enregistrée (" + fbCode(e) + ").", "late"); el.disabled = false; $("#arch-msg").textContent = ""; }
      break;
    }
    case "archdel": {
      if(!isAdmin()) break;
      if(!el.dataset.ok){ el.dataset.ok = "1"; el.textContent = "Confirmer"; break; }
      const id = el.dataset.id;
      try{ await S.fb.rdb.ref().update({["archives/" + id]: null, ["archIdx/" + id]: null}); toast("Archive supprimée."); }
      catch(e){ toast("Non supprimée (" + fbCode(e) + ").", "late"); }
      break;
    }
    case "nextyeargo": {
      const ids = pickedSections("ny-secs");
      if(!ids.length){ $("#ny-msg").textContent = "Choisissez au moins une section."; break; }
      el.disabled = true; $("#ny-msg").textContent = "Préparation du fichier…";
      await exportXlsx(ids, false, S.nextYear || nextYearPlan());
      el.disabled = false; $("#ny-msg").textContent = "";
      break;
    }
    case "print": openPrint(); break;
    case "printgo": {
      el.disabled = true; $("#pr-msg").textContent = "Préparation de la fiche…";
      const ok = await printWeek({week:Number($("#pr-week").value), late:$("#pr-late").checked, next:$("#pr-next").checked});
      if(ok) closeDlg(); else { el.disabled = false; $("#pr-msg").textContent = ""; }
      break;
    }
    case "xlsxexpgo": {
      const ids = pickedSections("exp-secs");
      if(!ids.length){ $("#exp-msg").textContent = "Choisissez au moins une section."; break; }
      el.disabled = true; $("#exp-msg").textContent = "Préparation du fichier…";
      await exportXlsx(ids, $("#exp-suivi").checked);
      closeDlg(); break;
    }
    case "impanalyze": el.disabled = true; await analyzeImport(); el.disabled = false; break;
    case "pickall": case "picknone": for(const i of document.querySelectorAll(`#${el.dataset.id} input`)) i.checked = a === "pickall"; break;
    case "xlsximp": openImport(); break;
    case "impapply": {
      const plan = S.importPlan; if(!plan || !plan.out.length) break;
      el.disabled = true; let ok = 0;
      for(let i = 0; i < plan.out.length; i++){
        const pr = $("#imp-prog"); if(pr) pr.textContent = `Enregistrement ${i + 1} / ${plan.out.length}…`;
        if(await writeMod(plan.out[i].mid, plan.out[i].patch)) ok++; else break;
      }
      S.importPlan = null; closeDlg();
      toast(ok === plan.out.length ? `Import terminé : ${ok} machine${ok > 1 ? "s" : ""} mise${ok > 1 ? "s" : ""} à jour.` : `Import interrompu : ${ok} sur ${plan.out.length} enregistrées.`, ok === plan.out.length ? "" : "late");
      break;
    }
    case "editmode":
      if(!canPlan()) return;
      if(S.mode === "db" && S.isOwner && S.uid && S.config.owner !== S.uid && !(await writeConfig({owner:S.uid}))) return;
      S.editing = true; S.undo = []; render(); break;
    case "editdone": S.editing = false; render(); break;
    case "brush": S.brush = el.dataset.v; for(const b of document.querySelectorAll('[data-act="brush"]')) b.setAttribute("aria-pressed", String(b.dataset.v === S.brush)); break;
    case "paint": paint(el.dataset.mid, Number(el.dataset.w)); break;
    case "undo": undoPaint(); break;
    case "medit": openMachineEdit(el.dataset.mid); break;
    case "addm": openMachineEdit(null); break;
    case "delm": {
      const mid = el.dataset.mid, m = byId[mid];
      if(await writeMod(mid, {supprime:{v:true, at:new Date().toISOString()}})){ closeDlg(); toast(`Machine ${m ? m.num : ""} supprimée`, "", {label:"Annuler", fn:() => writeMod(mid, {supprime:{v:false, at:new Date().toISOString()}})}); }
      break;
    }
    case "reqaccess": openRequest(); break;
    case "theme": S.theme = {auto:"dark", dark:"light", light:"auto"}[S.theme] || "auto"; saveUI(); applyTheme(); render(); toast("Thème : " + THEME_LABEL[S.theme].toLowerCase()); break;
    case "tv": tvStart(); break;
    case "tvstop": tvStop(); break;
    case "people": S.showPeople = !S.showPeople; saveUI(); render(); break;
    case "whoeq": S.filters.who = el.dataset.who; saveUI(); go("equipes"); break;
    case "orgform": openOrgForm(el.dataset.k, el.dataset.svc, el.dataset.tl, el.dataset.tech); break;
    case "orgreset": openOrgReset(el.dataset.svc || ""); break;
    case "secform": openSectionForm(el.dataset.svc || null); break;
    case "secedit": openSectionEditor(el.dataset.svc); break;
    case "tledit": openTlGroup((el.dataset.svcs || "").split(",")); break;
    case "se-add": { const k = el.dataset.k, box = $("#se-" + k); if(box && S.seRows){ box.insertAdjacentHTML("beforeend", S.seRows[k]({})); const inp = box.lastElementChild.querySelector("input"); if(inp) inp.focus(); } break; }
    case "se-del": { const row = el.closest(".erow"); if(!row) break; if(row.dataset.id || row.dataset.old) row.hidden = true; else row.remove(); break; }
    case "se-plan": { const svc = el.dataset.svc; closeDlg(); S.filters = {svc, who:"", q:""}; saveUI(); S.editing = canPlan(); S.undo = []; go("planning"); break; }
    case "se-addm": { const svc = el.dataset.svc; closeDlg(); S.filters.svc = svc; saveUI(); openMachineEdit(null); break; }
    case "tlform": personForm("tl", el.dataset.svc, el.dataset.id || null); break;
    case "shiftform": personForm("shift", el.dataset.svc, el.dataset.id || null); break;
    case "tldel": case "shiftdel": {
      const svc = el.dataset.svc, id = el.dataset.id, sec = SVC[svc], isTl = a === "tldel";
      const r = sec && (isTl ? sec.tls : sec.shifts).find(x => x.id === id);
      if(!r) break;
      const ok = await writeOrg(o => {
        if(isTl){
          const arr = materializeTls(o, svc); o.secTls[svc] = arr.filter(x => x.id !== id);
          if(o.secShifts && o.secShifts[svc]) o.secShifts = Object.assign({}, o.secShifts, {[svc]: o.secShifts[svc].map(x => x.tl === id ? Object.assign({}, x, {tl:""}) : x)});
        } else o.secShifts = Object.assign({}, o.secShifts, {[svc]: (o.secShifts && o.secShifts[svc] || []).filter(x => x.id !== id)});
      }, `${sec.name} · ${isTl ? "TL" : "responsable shift"} retiré : ${r.name}`);
      if(ok){ closeDlg(); toast(`${r.name} retiré.`); }
      break;
    }
    case "secdel": {
      const svc = el.dataset.svc, x = SVC[svc];
      if(await writeOrg(o => { o.sections = (o.sections || []).filter(a => a.id !== svc); if(o.svcNames) delete o.svcNames[svc]; if(o.svcTl) delete o.svcTl[svc]; if(o.secTls) delete o.secTls[svc]; if(o.secShifts) delete o.secShifts[svc]; }, `Section supprimée : ${x ? x.name : svc}`)){
        if(S.filters.svc === svc){ S.filters.svc = ""; saveUI(); }
        closeDlg(); toast("Section supprimée.");
      }
      break;
    }
    case "orgresetok": {
      const svc = el.dataset.svc || "";
      const ok = await writeOrg(o => {
        if(svc){ o.tl = (o.tl || []).filter(r => r.svc !== svc); o.tlRename = (o.tlRename || []).filter(r => r.svc !== svc); if(o.tls) delete o.tls[svc]; }
        else { o.tl = []; o.tlRename = []; o.tls = {}; o.techRename = []; }
      }, `${svc ? SVC[svc].name : "Tous les services"} · retour aux équipes de l'Excel`);
      if(ok){ closeDlg(); toast("Équipes de l'Excel rétablies."); }
      break;
    }
    case "techopen": { const k = el.dataset.key; if(S.openTech[k]) delete S.openTech[k]; else S.openTech[k] = 1; render(); break; }
    case "deltl": { const svc = el.dataset.svc, tl = el.dataset.tl; if(await writeOrg(o => { o.tls = o.tls || {}; o.tls[svc] = (o.tls[svc] || []).filter(x => x !== tl); }, `${SVC[svc].name} · responsable d'équipe retiré : ${tl}`)) toast("Responsable d'équipe retiré."); break; }
    case "deltech": { const svc = el.dataset.svc, tech = el.dataset.tech; if(await writeOrg(o => { o.tl = (o.tl || []).filter(r => !(r.svc === svc && r.tech === tech)); }, `${SVC[svc].name} · technicien retiré : ${tech}`)) toast("Technicien retiré."); break; }
    case "approve": setChef(el.dataset.uid, true); break;
    case "acct": setRole(el.dataset.uid, el.dataset.v); break;
    case "acctname": openAcctName(el.dataset.uid); break;
    case "acctdel": openAcctDel(el.dataset.uid); break;
    case "acctdelok": el.disabled = true; if(await deleteAccount(el.dataset.uid)) closeDlg(); else el.disabled = false; break;
    case "logout": if(S.fb) S.fb.auth.signOut(); break;
    case "install": installApp(); break;
    case "helper": openHelper(null); break;
    case "hpclose": closeHelper(); break;
    case "hpnew": if(!HP.busy){ HP.msgs = []; HP.ctx = null; hpSave(); renderHelper(); } break;
    case "hpctx": HP.ctx = null; renderHelper(); break;
    case "hpitem": { const it = S.D.idx.get(el.dataset.k); closeDlg(); if(it) openHelper({mid: it.m.id, code: it.code, w: it.w}); break; }
    case "hpkeysave2": { // activation depuis la fenêtre HELPER
      const v = ($("#hp-key2").value || "").trim();
      if(!aiKeyOk(v)){ toast("Clé non reconnue : collez la clé Google (elle commence par AIza).", "late"); break; }
      if(FIREBASE ? await setHelperKey(v) : (lsSet(AI_KEY, v), true)){
        HP.msgs = HP.msgs.filter(x => !x.err); hpSave(); toast("HELPER est activé pour toute l'équipe.");
        renderHelper(); const i = $("#hp-in"); if(i) i.focus();
      }
      break;
    }
    case "hpkeysave": { const v = ($("#hp-key").value || "").trim(); if(!aiKeyOk(v)){ toast("Clé non reconnue : collez la clé Google (AIza…) ou Anthropic (sk-ant-…).", "late"); break; } if(await setHelperKey(v)){ toast("Clé enregistrée : HELPER est activé pour l'équipe."); $("#hp-key").value = ""; } break; }
    case "hpkeydel": if(await setHelperKey("")) toast("Clé retirée : HELPER est arrêté."); break;
    case "revoke": setChef(el.dataset.uid, false); break;
    case "savestart": { const v = Number($("#set-start").value); if(await writeConfig({start:v})) toast("Début du suivi : S"+v); break; }
  }
});
dlg.addEventListener("click", ev => { if(ev.target === dlg) closeDlg(); });
dlg.addEventListener("close", () => { dlg.className = ""; });
document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-chg]"); if(!el) return;
  if(el.dataset.chg === "tl") setTechTL(el.dataset.svc, el.dataset.tech, el.value);
  else if(el.dataset.chg === "mtech") setMachineTech(el.dataset.mid, el.value);
  else if(el.dataset.chg === "acctrole"){ if(el.value) setRole(el.dataset.uid, el.value); }
  else if(el.dataset.chg === "accttl") setTlLink(el.dataset.uid, el.value);
  else if(el.dataset.chg === "theme"){ S.theme = el.value; saveUI(); applyTheme(); render(); }
});
$("#f-svc").addEventListener("change", e => { S.filters.svc = e.target.value; saveUI(); render(); });
$("#f-who").addEventListener("change", e => { S.filters.who = e.target.value; saveUI(); render(); });
let qT = 0;
function pickByMat(v, strict){ // matricule tapé dans la recherche : choisit la personne dans « Responsable »
  const k = matKey(v); if(!k) return false;
  const live = liveNames(), hits = [...MATS].filter(([n, mt]) => live.has(n) && matKey(mt).startsWith(k)), ex = hits.find(([, mt]) => matKey(mt) === k);
  if(!ex || (strict && hits.length > 1)) return false; // « 12 » n'est pas choisi tant que « 123 » existe (Entrée pour forcer)
  const n = ex[0], f = S.filters;
  if(f.svc && !machines.some(m => m.svc === f.svc && (m.tech === n || m.chef === n)) && !SVC[f.svc].tls.some(t => t.name === n)) f.svc = "";
  f.who = n; f.q = ""; $("#f-q").value = ""; saveUI(); toast(`Matricule ${ex[1]} : ${n}`); render();
  return true;
}
$("#f-q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { if(pickByMat(e.target.value, true)) return; S.filters.q = e.target.value; render(); }, 180); });
$("#f-q").addEventListener("keydown", e => { if(e.key === "Enter"){ clearTimeout(qT); if(!pickByMat(e.target.value, false)){ S.filters.q = e.target.value; render(); } } });
$("#f-clear").addEventListener("click", () => { S.filters = {svc:"", who:"", q:""}; S.expanded = {}; saveUI(); render(); });
setInterval(() => { const w = yearWeek(new Date()); if(w !== CW){ CW = w; scheduleRender(); } }, 10*60*1000);
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape" && document.body.classList.contains("tv")){ tvStop(); return; }
  const tag = (ev.target && ev.target.tagName) || "";
  if(ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag) && !dlg.open){ ev.preventDefault(); $("#f-q").focus(); return; }
  if((ev.key === "Enter" || ev.key === " ") && ev.target && ev.target.matches && ev.target.matches('[role="button"][data-go]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("fullscreenchange", () => { if(!document.fullscreenElement && document.body.classList.contains("tv")) tvStop(); });
$("#logo").innerHTML = ico("logo"); $("#tv-logo").innerHTML = ico("logo");
applyTheme();

const h0 = (location.hash || "").slice(1);
if(VIEWS.includes(h0)) S.view = h0;
else if(h0 === "techniciens") S.view = "equipes";
buildMachines();
render();
initStore();
</script>

</body></html>

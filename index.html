<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="site/preventif.ico"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0E151B"><link rel="apple-touch-icon" href="site/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Préventif"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Préventif Maintenance 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : application atelier comme Crimping Pro — menu latéral sombre, barre de titre avec filtres, Hub en tableau de bord ; thème sombre par défaut, thème clair « atelier », mode TV. */
:root{
  --bg:#0E151B; --surface:#16212A; --surface-2:#1B2731; --ink:#E3E9EE; --ink-2:#A3B2BF; --ink-3:#7B8B99; --line:#2B3A47; --line-2:#22303B;
  --accent:#4DB2C1; --accent-ink:#06262C; --accent-soft:#163840;
  --late:#F0685F; --late-soft:#3B1D1C; --week:#F0B53D; --week-solid:#E0A021; --week-soft:#3A2D12; --next:#78A6F0; --next-soft:#1B2A44;
  --done:#52C47F; --done-soft:#15301F; --moved:#B593EA; --moved-soft:#2C2142; --off:#7E8B96; --off-soft:#1E2A33;
  --tM:#3F9B4C; --tT:#D4B421; --tS:#2D8EC4; --tA:#CC4434; --tH:#71808C; --tD:#5B6B7A; --t-ink:#FFFFFF; --tT-ink:#211C00;
  --c-done:#4CC27A; --c-late:#D94A40; --c-week:#E0A021; --c-plan:#3A4B5A; --c-hors:#25323D;
  --side:#0A1016; --side-2:#16212B; --side-ink:#DDE6ED; --side-mute:#7D8E9C; --side-line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#ECEFF1; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#13202B; --ink-2:#4B5A68; --ink-3:#768592; --line:#D3DAE0; --line-2:#E4E9ED;
  --accent:#0F5F6E; --accent-ink:#FFFFFF; --accent-soft:#DBECEE;
  --late:#BF3129; --late-soft:#FBE3E0; --week:#A86E00; --week-solid:#E9A91F; --week-soft:#FCEFD0; --next:#2A5FB3; --next-soft:#E0E9F7;
  --done:#1E7744; --done-soft:#DCF0E3; --moved:#6E45AB; --moved-soft:#ECE3F7; --off:#8995A0; --off-soft:#EDF0F2;
  --tM:#3E9E4B; --tT:#E0BF1C; --tS:#2B95D0; --tA:#D23F2E; --tH:#8A96A1; --tD:#5E6E7E; --t-ink:#FFFFFF; --tT-ink:#2B2500;
  --c-done:#1E7744; --c-late:#C8372D; --c-week:#D99A16; --c-plan:#BFC9D2; --c-hors:#E4E9ED;
  --side:#13202B; --side-2:#1F3140; --side-ink:#E3EAF0; --side-mute:#8FA2B2; --side-line:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(19,32,43,.06),0 6px 18px rgba(19,32,43,.07); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#13202B; --ink-2:#4B5A68; --ink-3:#768592; --line:#D3DAE0; --line-2:#E4E9ED;
  --accent:#0F5F6E; --accent-ink:#FFFFFF; --accent-soft:#DBECEE;
  --late:#BF3129; --late-soft:#FBE3E0; --week:#A86E00; --week-solid:#E9A91F; --week-soft:#FCEFD0; --next:#2A5FB3; --next-soft:#E0E9F7;
  --done:#1E7744; --done-soft:#DCF0E3; --moved:#6E45AB; --moved-soft:#ECE3F7; --off:#8995A0; --off-soft:#EDF0F2;
  --tM:#3E9E4B; --tT:#E0BF1C; --tS:#2B95D0; --tA:#D23F2E; --tH:#8A96A1; --tD:#5E6E7E; --t-ink:#FFFFFF; --tT-ink:#2B2500;
  --c-done:#1E7744; --c-late:#C8372D; --c-week:#D99A16; --c-plan:#BFC9D2; --c-hors:#E4E9ED;
  --side:#13202B; --side-2:#1F3140; --side-ink:#E3EAF0; --side-mute:#8FA2B2; --side-line:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(19,32,43,.06),0 6px 18px rgba(19,32,43,.07); color-scheme:light;
}
body.ui-light{
  --bg:#ECEFF1; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#13202B; --ink-2:#4B5A68; --ink-3:#768592; --line:#D3DAE0; --line-2:#E4E9ED;
  --accent:#0F5F6E; --accent-ink:#FFFFFF; --accent-soft:#DBECEE;
  --late:#BF3129; --late-soft:#FBE3E0; --week:#A86E00; --week-solid:#E9A91F; --week-soft:#FCEFD0; --next:#2A5FB3; --next-soft:#E0E9F7;
  --done:#1E7744; --done-soft:#DCF0E3; --moved:#6E45AB; --moved-soft:#ECE3F7; --off:#8995A0; --off-soft:#EDF0F2;
  --tM:#3E9E4B; --tT:#E0BF1C; --tS:#2B95D0; --tA:#D23F2E; --tH:#8A96A1; --tD:#5E6E7E; --t-ink:#FFFFFF; --tT-ink:#2B2500;
  --c-done:#1E7744; --c-late:#C8372D; --c-week:#D99A16; --c-plan:#BFC9D2; --c-hors:#E4E9ED;
  --side:#13202B; --side-2:#1F3140; --side-ink:#E3EAF0; --side-mute:#8FA2B2; --side-line:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(19,32,43,.06),0 6px 18px rgba(19,32,43,.07); color-scheme:light;
}
body.ui-dark{
  --bg:#0E151B; --surface:#16212A; --surface-2:#1B2731; --ink:#E3E9EE; --ink-2:#A3B2BF; --ink-3:#7B8B99; --line:#2B3A47; --line-2:#22303B;
  --accent:#4DB2C1; --accent-ink:#06262C; --accent-soft:#163840;
  --late:#F0685F; --late-soft:#3B1D1C; --week:#F0B53D; --week-solid:#E0A021; --week-soft:#3A2D12; --next:#78A6F0; --next-soft:#1B2A44;
  --done:#52C47F; --done-soft:#15301F; --moved:#B593EA; --moved-soft:#2C2142; --off:#7E8B96; --off-soft:#1E2A33;
  --tM:#3F9B4C; --tT:#D4B421; --tS:#2D8EC4; --tA:#CC4434; --tH:#71808C; --tD:#5B6B7A; --t-ink:#FFFFFF; --tT-ink:#211C00;
  --c-done:#4CC27A; --c-late:#D94A40; --c-week:#E0A021; --c-plan:#3A4B5A; --c-hors:#25323D;
  --side:#0A1016; --side-2:#16212B; --side-ink:#DDE6ED; --side-mute:#7D8E9C; --side-line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* App shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:14px;padding-block:16px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;scrollbar-width:thin}
.side-brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.side-brand b{display:block;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.04em;line-height:1}
.side-brand span{display:block;font-size:12px;color:var(--side-mute);margin-top:3px}
.plate{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;border:1px solid var(--side-line);border-radius:8px;padding:9px 12px;background:var(--side-2);color:var(--side-ink)}
.plate-w{grid-row:span 2;font-family:var(--f-mono);font-weight:600;font-size:28px;line-height:1;letter-spacing:-.02em}
.plate-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-mute)}
.plate-d{font-size:13px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-mute);padding:12px 10px 4px;font-weight:600}
.tab{appearance:none;border:0;background:none;color:var(--side-ink);display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:7px;font-weight:500;font-size:14.5px;text-align:left;cursor:pointer;white-space:nowrap}
.tab svg{width:19px;height:19px;flex:none;opacity:.8}
.tab:hover{background:var(--side-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tab[aria-selected="true"] svg{opacity:1}
.tab .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:9px;background:var(--late);color:#fff}
.tab .cnt[hidden]{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.me{background:var(--side-2);border:1px solid var(--side-line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.me .role{align-self:flex-start;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:9px;background:var(--accent);color:var(--accent-ink)}
.me b{font-size:14px;overflow-wrap:anywhere}
.me .sync{display:flex;gap:6px;align-items:center;color:var(--side-mute);font-size:12px}
.me .sync i{width:8px;height:8px;border-radius:50%;background:var(--c-done);flex:none}
.me .sync.warn i{background:var(--c-week)}
.side-tools{display:flex;gap:6px;flex-wrap:wrap}
.sbtn{appearance:none;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);border-radius:6px;padding:6px 10px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.sbtn:hover{background:var(--side-2)}
.sbtn svg{width:15px;height:15px}
.side-acts{display:flex;gap:6px;flex-wrap:wrap}
.side-acts:empty{display:none}
.sbtn.out{background:#C62828;border-color:#C62828;color:#fff;font-weight:600}
.sbtn.out:hover{background:#A51F1F}
.sbtn.inst{border-color:var(--accent);color:var(--side-ink)}
.side-acts-m,.me-m-row{display:none}
.me .ident{font-size:12px;color:var(--side-mute);font-family:var(--f-mono)}
.inst-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.inst-steps b{color:var(--ink)}
.doc-ref{font-family:var(--f-mono);font-size:10.5px;color:var(--side-mute);letter-spacing:.03em}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tb-title{min-width:0}
.tb-title h1{font-size:26px;font-weight:700;line-height:1.1}
.tb-sub{font-size:13px;color:var(--ink-3)}
.filters{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 520px;justify-content:flex-end}
.filters select,.filters input{height:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:0 10px;min-width:0}
.filters input{flex:1 1 200px;max-width:340px}
.filters select{flex:0 1 230px}
.filters .clear{height:36px}
.content{padding-block:18px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1500px;width:100%}
.tv-bar{display:none}

/* Banner */
.banner{margin-bottom:16px;padding:10px 14px;border-radius:var(--r);font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.banner.warn{border-color:var(--week);background:var(--week-soft);color:var(--ink)}

section[data-view]{display:flex;flex-direction:column;gap:22px}

/* Hub */
.hub{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.hub > *{min-width:0}
.s2{grid-column:span 2}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s12{grid-column:1/-1}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;align-items:center}
.hero .k,.stile .k{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:7px}
.hero .v{font-weight:600;font-size:60px;line-height:1;letter-spacing:-.01em}
.hero .hs{font-size:14px;color:var(--ink-2)}
.hero .hs b{color:var(--ink)}
.hero .meter{grid-column:1/-1;height:8px;margin:0}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stile[data-go]{cursor:pointer}
.stile[data-go]:hover{border-color:var(--ink-3)}
.stile .k i{width:9px;height:9px;border-radius:50%;flex:none}
.stile .v{font-weight:600;font-size:36px;line-height:1.05}
.stile .s{font-size:13px;color:var(--ink-3)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lgd b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chart-wrap{padding:6px 16px 12px;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:640px;height:auto}
.chart-wrap .gl{stroke:var(--line-2);stroke-width:1}
.chart-wrap .ax{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart-wrap .ax.cw{fill:var(--ink);font-weight:600}
.chart-wrap .cwl{stroke:var(--accent);stroke-width:1.5}
.chart-wrap .cwt{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--f-body)}
.chart-wrap .hit{fill:transparent;cursor:default}
.chart-wrap .hit:hover{fill:var(--ink);fill-opacity:.07}
.tlr{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:9px 16px;border-top:1px solid var(--line-2)}
.tlr[data-act]{cursor:pointer}
.tlr[data-act]:hover{background:var(--surface-2)}
.tlr .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tlr .nm span{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.sbar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;background:var(--surface)}
.sbar i{display:block;height:100%;min-width:2px}
.sbar.empty{background:var(--line-2)}
.tlr .val,.tyr .val{font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.tlr .val b,.tyr .val b{color:var(--ink);font-size:15px}
.heat-wrap{overflow-x:auto;padding:4px 13px 12px}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px}
.heat th{font-weight:600;font-size:12px;color:var(--ink-2);text-align:center;padding:4px;white-space:nowrap}
.heat th span{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.heat th.cw{color:var(--ink)}
.heat th.l{text-align:left}
.heat td.l{font-weight:500;padding:4px 10px 4px 0;min-width:150px;overflow-wrap:anywhere}
.heat td.l span{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.heat td.h{text-align:center;border-radius:4px;height:32px;min-width:48px;font-variant-numeric:tabular-nums;font-weight:600;background:var(--surface-2);color:var(--ink)}
.heat td.h.hi{color:var(--accent-ink)}
.tyr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 16px}
.tyb{height:12px}
.tyb i{display:block;height:100%;border-radius:0 4px 4px 0}
.jr .kind{white-space:nowrap}

/* Mode TV */
body.tv .side,body.tv .topbar{display:none}
body.tv .app{grid-template-columns:minmax(0,1fr)}
body.tv .tv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--side);color:var(--side-ink)}
.tv-bar b{font-family:var(--f-display);font-size:30px;letter-spacing:.04em}
.tv-bar .tv-svc{font-size:24px;font-weight:600;color:var(--accent)}
.tv-bar .tv-wk{font-size:18px;color:var(--side-mute)}
.tv-bar .tv-clock{margin-left:auto;font-family:var(--f-mono);font-size:30px}
body.tv .content{max-width:none}
body.tv .hero .v{font-size:96px}
body.tv .stile .v{font-size:56px}
body.tv .it-act{display:none}

@media (max-width:1200px){ .hub .hero{grid-column:1/-1} .hub .s2{grid-column:span 3} .hub .s7,.hub .s5{grid-column:1/-1} }
@media (max-width:460px){ .side-acts-m .inst .lbl,.side-brand > div{display:none} }
@media (max-width:380px){ .me-m-row .me-m .role-l,.me-m-row .me-m .ident{display:none} .me-m-row .me-m .role-s{display:inline} }
@media (max-width:700px){ .hub .s2{grid-column:span 6} .hero .v{font-size:48px} .tlr{grid-template-columns:minmax(0,1fr) auto} .tlr .sbar{grid-column:1/-1;order:3} }
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{z-index:6;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:10px 8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .plate{margin-left:auto;padding:5px 10px}
  .plate-w{font-size:20px}
  .plate-k{display:none}
  .nav{flex-direction:row;flex-basis:100%;overflow-x:auto;scrollbar-width:none;gap:4px}
  .nav::-webkit-scrollbar{display:none}
  .nav-h,.side-foot{display:none}
  .side-acts-m{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:nowrap}
  .side-acts-m .sbtn{padding:6px 9px;flex:none}
  .me-m-row{display:flex;flex-basis:100%;min-width:0}
  .me-m-row:empty{display:none}
  .me-m{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;color:var(--side-ink);font-size:13.5px;background:var(--side-2);border:1px solid var(--side-line);border-radius:8px;padding:5px 9px}
  .me-m .role{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:9px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}

}
@media (max-width:480px){ .plate-d{display:none} }

/* Alarm strip *//* Alarm strip */
.alarm{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 16px;border-radius:var(--r);background:var(--late);color:#fff;font-weight:500}
.alarm b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.01em}
.alarm.ok{background:var(--done)}
.alarm button{margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#fff}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--c,var(--line))}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--ink-2)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px}

/* Panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:21px;font-weight:700}
.panel-h h2 .c{font-family:var(--f-mono);font-size:14px;color:var(--ink-3);font-weight:500;margin-left:6px}
.panel-h .note{color:var(--ink-3);font-size:13px}
.panel-h .tools{display:flex;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr[data-act]{cursor:pointer}
table.t tr[data-act]:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
.rate{display:flex;align-items:center;gap:8px;min-width:120px}
.rate .meter{flex:1;margin:0}
.rate span{font-family:var(--f-mono);font-size:12.5px;width:40px;text-align:right}
.z{color:var(--ink-3)}
.lateN{color:var(--late);font-weight:600}

/* Items */
.list{display:flex;flex-direction:column}
.grp{display:flex;gap:8px;align-items:baseline;padding:10px 16px 6px;font-weight:600;font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line-2)}
.grp:first-child{border-top:0}
.grp .z{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-weight:500}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:9px 16px 9px 13px;border-left:3px solid var(--sc,transparent);cursor:pointer}
.it:hover{background:var(--surface-2)}
.it-title{font-weight:600;overflow-wrap:anywhere}
.it-title .mono{font-weight:600;margin-right:6px}
.it-title .ty{font-weight:400;color:var(--ink-2)}
.it-meta{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.it-act{display:flex;gap:6px}
.it.st-retard{--sc:var(--late)} .it.st-semaine{--sc:var(--week-solid)} .it.st-prochaine{--sc:var(--next)} .it.st-fait{--sc:var(--done)} .it.st-planifie{--sc:var(--line)}
.it.st-fait .it-title{color:var(--ink-2)}
.more{padding:10px 16px;border-top:1px solid var(--line-2)}
.empty{padding:22px 16px;color:var(--ink-3);font-size:14px}

.tcode{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--t-ink);background:var(--tH)}
.tM{background:var(--tM)} .tT{background:var(--tT);color:var(--tT-ink)} .tS{background:var(--tS)} .tA{background:var(--tA)} .tH{background:var(--tH)} .tD{background:var(--tD)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:12px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.week{background:var(--week-soft);color:var(--week)}
.pill.next{background:var(--next-soft);color:var(--next)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.moved{background:var(--moved-soft);color:var(--moved)}
.pill.off{background:var(--off-soft);color:var(--off)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-3)}
.btn.ok{background:var(--done);border-color:var(--done);color:#fff}
.btn.ok:hover{filter:brightness(1.08)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Planning grid */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink-2)}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.grid-wrap{overflow:auto;max-height:72vh;border-top:1px solid var(--line-2)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{width:25px;min-width:25px;height:25px;padding:0;text-align:center;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-family:var(--f-mono);font-weight:500;color:var(--ink-3);font-size:10.5px;height:30px}
.grid thead th.cw{background:var(--accent);color:var(--accent-ink);font-weight:600}
.grid .mcol{position:sticky;left:0;z-index:1;width:190px;min-width:190px;text-align:left;padding:2px 10px;background:var(--surface);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.grid thead .mcol{z-index:3;background:var(--surface-2)}
.grid .mcol b{font-family:var(--f-mono);font-weight:600;font-size:12px;margin-right:6px}
.grid .mcol span{color:var(--ink-3);font-size:11.5px}
.grid tr.gs td,.grid tr.gt td{text-align:left;height:auto;border-right:0}
.grid tr.gs td{background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.03em;padding:5px 0}
.grid tr.gt td{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:12px;padding:5px 0}
.grid .stick{position:sticky;left:10px;padding-left:10px}
.grid td.cwc{background:var(--accent-soft)}
.grid td.off{background:repeating-linear-gradient(135deg,var(--line-2) 0 3px,transparent 3px 6px)}
.grid td.c{font-family:var(--f-mono);font-weight:600;cursor:pointer;position:relative}
.grid td.oth{opacity:.25}
.grid td.c:hover{outline:2px solid var(--ink);outline-offset:-2px}
.grid td.ghost{color:var(--moved);font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--moved);border-radius:3px}
.grid tr.susp .mcol{opacity:.55}
.grid .pc{position:sticky;z-index:1;background:var(--surface);text-align:left;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-size:11.5px;color:var(--ink-2);border-right:1px solid var(--line-2)}
.grid thead .pc{z-index:3;background:var(--surface-2);font-family:var(--f-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.grid .pc-m{left:0;width:160px;min-width:160px;max-width:160px;cursor:pointer}
.grid .pc-tl{left:160px;width:120px;min-width:120px;max-width:120px}
.grid .pc-ch{left:280px;width:170px;min-width:170px;max-width:170px}
.grid .pc-te{left:450px;width:145px;min-width:145px;max-width:145px;border-right:2px solid var(--line)}
.grid td.pc-p[data-act]{cursor:pointer}
.grid td.pc-p[data-act]:hover{color:var(--accent);text-decoration:underline}
.grid .pc-m b{font-family:var(--f-mono);font-weight:600;font-size:12px;margin-right:6px;color:var(--ink)}
.grid .pc-m span{color:var(--ink-3)}
.grid tr.susp .pc{opacity:.55}
.grid.nopeople .pc-p{display:none}
.grid.nopeople .pc-m{width:190px;min-width:190px;max-width:190px;border-right:2px solid var(--line)}
@media (max-width:700px){ .grid .pc-p{display:none} .grid .pc-m{border-right:2px solid var(--line)} }
/* status colours */
.by-st td.st-fait{background:var(--done);color:#fff}
.by-st td.st-retard{background:var(--late);color:#fff}
.by-st td.st-semaine{background:var(--week-solid);color:#241800}
.by-st td.st-prochaine{background:var(--next-soft);color:var(--next);box-shadow:inset 0 0 0 1px var(--next)}
.by-st td.st-planifie{background:var(--surface-2);color:var(--ink-2)}
.by-st td.st-hors{background:transparent;color:var(--ink-3);opacity:.6}
.by-st td.st-suspendu{background:transparent;color:var(--off);text-decoration:line-through}
/* type colours */
.by-ty td.c.tM{background:var(--tM);color:var(--t-ink)} .by-ty td.c.tT{background:var(--tT);color:var(--tT-ink)} .by-ty td.c.tS{background:var(--tS);color:var(--t-ink)}
.by-ty td.c.tA{background:var(--tA);color:var(--t-ink)} .by-ty td.c.tH{background:transparent;color:var(--ink-2)} .by-ty td.c.tD{background:var(--tD);color:var(--t-ink)}
.by-ty td.c.st-fait::after{content:"";position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--done)}
.by-ty td.c.st-retard{box-shadow:inset 0 0 0 2px var(--late)}
.by-ty td.c.st-suspendu{opacity:.35}
td.c.moved-from::before{content:"";position:absolute;left:2px;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--moved);box-shadow:0 0 0 1px var(--surface)}

/* Week strip in machine dialog */
.strip{display:grid;grid-template-columns:repeat(27,minmax(0,1fr));gap:2px}
.strip span{height:22px;border-radius:2px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;background:var(--line-2);color:var(--ink-3)}
.strip span.st-fait{background:var(--done);color:#fff} .strip span.st-retard{background:var(--late);color:#fff} .strip span.st-semaine{background:var(--week-solid);color:#241800}
.strip span.st-prochaine,.strip span.st-planifie{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.strip span.cw{outline:2px solid var(--accent);outline-offset:0}
.strip span.tM{background:var(--tM);color:var(--t-ink)} .strip span.tT{background:var(--tT);color:var(--tT-ink)} .strip span.tS{background:var(--tS);color:var(--t-ink)}
.strip span.tA{background:var(--tA);color:var(--t-ink)} .strip span.tD{background:var(--tD);color:var(--t-ink)} .strip span.tH{background:var(--surface-2);color:var(--ink-3)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.role-b{display:inline-block;font-family:var(--f-body);font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:7px;letter-spacing:.02em;text-transform:none;vertical-align:1px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.role-b.ra{border-color:var(--tS);color:var(--ink)}
.role-b.rm{border-color:var(--tM);color:var(--ink)}
.grid td.pc-ch.same{color:var(--ink-3);font-style:italic}
.grid td.tech-on,table.t td.tech-on{background:var(--done-soft);color:var(--done);font-weight:700;box-shadow:inset 3px 0 0 var(--done)}
.secpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px}
.secpick .chk .z{font-weight:400}
.grid tr.gs .gs-n{font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.85}
.strip span.off{background:repeating-linear-gradient(135deg,var(--line-2) 0 3px,transparent 3px 6px)}

/* Dialog */
dialog{border:0;padding:0;border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,18,25,.55)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.dlg-h h3{font-size:24px;font-weight:700;line-height:1.1}
.dlg-h .sub{color:var(--ink-2);font-size:14px;margin-top:3px}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);justify-content:flex-end}
.dlg-f .sp{flex:1}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--ink-3)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.chk-i{display:flex;gap:10px;align-items:flex-start;align-self:stretch;justify-content:flex-start;text-align:left;width:100%;box-sizing:border-box;font-size:15px;line-height:1.35;padding:7px 4px;border-bottom:1px solid var(--line-2);cursor:pointer}

.chk-i input:checked + span{color:var(--ink-3)}
fieldset.chk legend .z{font-weight:600}
fieldset.chk.ok{border-color:var(--done)}
fieldset.ai{border-color:var(--accent);background:var(--accent-soft)}
.hp-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;letter-spacing:.03em;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}

.hp{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:35;background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-8px 0 26px rgba(0,0,0,.22);display:flex;flex-direction:column}
.hp[hidden]{display:none}
.hp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.hp-h b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.05em}
.hp-h .sub{font-size:12px;color:var(--ink-3)}
.hp-h .btn{padding:6px 10px}
.hp-ctx{margin:10px 14px 0;padding:6px 10px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent);font-size:13px}
.hp-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.hp-m{max-width:90%;padding:9px 12px;border-radius:12px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}

.hp-m.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}

fieldset.ai input[type=file]{font-size:14px;max-width:100%}

.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}

async function fbSeed(uid){ // reprise des données de l'application claude.ai, une seule fois, dans une base vide

async function initStore(){

function subscribeAll(db){ // renvoie les fonctions de désabonnement
  return [
    db.collection("suivi").onSnapshot(snap => {

      S.suivi = o; S.loaded = true; scheduleRender();
    }, err => { toast("Synchronisation interrompue ("+err.code+"). Rechargez la page.", "late"); }),
    db.doc("config/main").onSnapshot(snap => { S.config = snap.exists ? snap.data() : {}; syncModSubs(); buildMachines(); scheduleRender(); }, () => {}),
    db.collection(REQ_COLL).onSnapshot(snap => { const o = {}; for(const d of snap.docs) o[d.id] = d.data(); S.reqs = o; scheduleRender(); }, () => {}),
    db.doc("config/std").onSnapshot(snap => { S.std = snap.exists ? snap.data() : {}; scheduleRender(); }, () => {}),
    db.doc("config/apipro").onSnapshot(snap => { S.apipro = snap.exists ? snap.data() : {}; }, () => {}),
    db.doc("config/org").onSnapshot(snap => { S.org = snap.exists ? snap.data() : {}; S.orgLoaded = true; buildMachines(); scheduleRender(); if(FIREBASE) fbSyncMats(); }, () => {})
  ];
}
const modSubs = {};
function syncModSubs(){
  if(!S.db) return;
  const want = new Set(modUids());
  for(const uid of Object.keys(modSubs)) if(!want.has(uid)){ modSubs[uid](); delete modSubs[uid]; delete S.mods[uid]; }
  for(const uid of want){
    if(modSubs[uid]) continue;
    modSubs[uid] = S.db.collection("modifs").doc(uid).collection("machines").onSnapshot(snap => {
      const o = {}; for(const d of snap.docs) o[d.id] = d.data();
      S.mods[uid] = o; buildMachines(); scheduleRender();
    }, err => { toast("Modifications du planning non synchronisées ("+err.code+").", "late"); });
  }
}
function deepMerge(t, p){ for(const k in p){ const v = p[k]; if(v && typeof v === "object" && !Array.isArray(v)){ if(!t[k] || typeof t[k] !== "object") t[k] = {}; deepMerge(t[k], v); } else t[k] = v; } return t; }
async function writeDoc(mid, patch){
  patch = clone(patch);
  if(S.mode === "local"){
    S.suivi[mid] = deepMerge(clone(S.suivi[mid]) || {}, patch);
    saveLocalAll(); scheduleRender(); return true;
  }
  if(S.mode !== "db" || !S.loaded){ toast(S.mode === "readonly" ? "Lecture seule : enregistrement impossible." : "Patientez, le suivi se charge…", "late"); return false; }
  const ref = S.db.collection("suivi").doc(mid);
  const attempt = async () => {
    try{ await ref.update(patch); }
    catch(e){ if(e && e.code === "invalid_argument") await ref.set(patch); else throw e; }
  };
  try{ await attempt(); return true; }
  catch(e){
    let err = e;
    if(err && err.code === "unavailable"){ await sleep(400 + Math.random()*600); try{ await attempt(); return true; }catch(e2){ err = e2; } }
    if(err && err.code === "invalid_argument"){ S.mode = "readonly"; S.canWrite = false; render(); toast("Enregistrement refusé : votre accès est en lecture seule.", "late"); return false; }
    if(err && err.code === "quota_exceeded"){ toast("Base de suivi pleine : "+err.message, "late"); return false; }
    toast("Enregistrement impossible ("+((err && err.code) || "erreur")+"). Réessayez.", "late"); return false;
  }
}
async function writeConfig(patch){
  const next = Object.assign({}, S.config, patch);
  if(S.mode === "local"){ S.config = next; saveLocalAll(); scheduleRender(); return true; }
  if(S.mode !== "db"){ toast("Lecture seule : réglage non enregistré.", "late"); return false; }
  try{ await S.db.doc("config/main").set(next); return true; }
  catch(e){ toast("Réglage non enregistré ("+(e && e.code)+").", "late"); return false; }
}
function saveLocalAll(){ if(!lsSet(LOCAL_KEY, {suivi:S.suivi, config:S.config, mods:S.mods, org:S.org, std:S.std, apipro:S.apipro})) toast("Ce navigateur refuse l'enregistrement local.", "late"); }
const modQ = {};
let ownerP = null;
function ensureOwner(){ // les modifications du manager ne sont visibles des autres qu'une fois son id connu
  if(S.mode !== "db" || !S.isOwner || !S.uid || S.config.owner === S.uid) return Promise.resolve(true);
  return ownerP || (ownerP = writeConfig({owner:S.uid}).finally(() => { ownerP = null; }));
}
function writeMod(mid, patch){
  patch = clone(patch);
  if(S.mode === "local"){
    const u = S.mods.local || (S.mods.local = {});
    u[mid] = deepMerge(clone(u[mid]) || {}, patch); saveLocalAll(); buildMachines(); scheduleRender();
    return Promise.resolve(true);
  }
  if(!canPlan()){ toast("Vous n'êtes pas autorisé à modifier le planning.", "late"); return Promise.resolve(false); }
  const ref = S.db.collection("modifs").doc(S.uid).collection("machines").doc(mid);
  const run = async () => {
    try{
      await ensureOwner();
      try{ await ref.update(patch); }
      catch(e){ if(e && e.code === "invalid_argument") await ref.set(patch); else throw e; }
      return true;
    }catch(e){ toast("Modification non enregistrée ("+((e && e.code) || "erreur")+").", "late"); return false; }
  };
  const pr = (modQ[mid] || Promise.resolve()).then(run, run); // une écriture à la fois par machine

}

function statsOf(its, D){
  const r = {late:0, wkOpen:0, wkDone:0, wk:0, due:0, dueDone:0, nx:0, rate:null};

let filtersBuilt = false;
let filtersSvc = null, filtersScope = "*";
function syncFilters(){
  const fs = $("#f-svc"), fw = $("#f-who");
  if(S.techName){ S.filters.svc = ""; S.filters.who = S.techName; } // technicien : seulement ses machines
  const inScope = x => !S.scope || S.scope.has(x.id), scopeKey = S.scope ? [...S.scope].join(",") : "*";
  if(S.scope && S.filters.svc && !S.scope.has(S.filters.svc)) S.filters.svc = "";
  if(!filtersBuilt || filtersSvc !== S.filters.svc || filtersScope !== scopeKey){
    filtersScope = scopeKey;
    fs.innerHTML = `<option value="">${S.scope ? "Toutes mes sections" : "Tous les services"}</option>` + SECTIONS.filter(inScope).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    const svcs = SECTIONS.filter(x => (!S.filters.svc || x.id === S.filters.svc) && inScope(x));
    const valid = new Set([""]);
    let html = `<option value="">${S.filters.svc ? "Tous les responsables · " + esc(SVC[S.filters.svc].name) : "Tous les responsables"}</option>`;
    for(const x of svcs){
      const ms = machines.filter(m => m.svc === x.id);
      const chefs = uniq(ms.map(m => m.chef)), techs = uniq(ms.map(m => m.tech));
      if(x.tls.length){ html += `<optgroup label="${esc(x.name)} · TL">${x.tls.map(t => `<option value="${esc(t.name)}">${esc(withMat(t.name))}</option>`).join("")}</optgroup>`; x.tls.forEach(t => valid.add(t.name)); }
      if(chefs.length) html += `<optgroup label="${esc(x.name)} · techniciens A·S·T">${chefs.map(n => `<option value="${esc(n)}">${esc(withMat(n))}</option>`).join("")}</optgroup>`;
      if(techs.length) html += `<optgroup label="${esc(x.name)} · techniciens${chefs.length ? " M" : ""}">${techs.map(n => `<option value="${esc(n)}">${esc(withMat(n))}</option>`).join("")}</optgroup>`;
      chefs.forEach(n => valid.add(n)); techs.forEach(n => valid.add(n));
    }
    if(S.techName && !valid.has(S.techName)){ html += `<option value="${esc(S.techName)}">${esc(S.techName)}</option>`; valid.add(S.techName); }
    fw.innerHTML = html;
    filtersBuilt = true; filtersSvc = S.filters.svc;
    if(!valid.has(S.filters.who)){ S.filters.who = ""; saveUI(); } // la personne choisie n'est pas dans ce service
  }
  fs.value = S.filters.svc; fw.value = S.filters.who;
  fs.disabled = fw.disabled = !!S.techName;
  if(fw.value !== S.filters.who){ S.filters.who = ""; fw.value = ""; }
  if($("#f-q").value !== S.filters.q) $("#f-q").value = S.filters.q;
}

function tcode(code){ return `<span class="tcode t${code}" title="${esc(TYPES[code]||code)}">${esc(code)}</span>`; }

const FOLD_DEF = {"al-sections": 1, "al-p-week": 1, "al-p-next": 1}; // Alertes : au départ, seuls les retards sont ouverts
const isFolded = k => k in S.fold ? !!S.fold[k] : !!FOLD_DEF[k];
const foldBtn = (key, folded) => `<button class="btn" data-act="fold" data-key="${esc(key)}" aria-expanded="${!folded}">${folded ? "Afficher" : "Masquer"}</button>`;
function listPanel(id, title, note, arr, opts){
  opts = opts || {};
  const si = {}; SECTIONS.forEach((x, i) => { si[x.id] = i; });
  const sorted = arr.slice().sort((a,b) => (si[a.m.svc] ?? 99) - (si[b.m.svc] ?? 99) || itemTech(a).localeCompare(itemTech(b), "fr") || (a.st==="fait")-(b.st==="fait") || a.ew-b.ew || a.m.num.localeCompare(b.m.num,"fr",{numeric:true}));
  const cap = S.expanded[id] ? Infinity : LIST_CAP;
  const cG = {}, cT = {};
  for(const it of sorted){ cG[it.m.svc] = (cG[it.m.svc]||0)+1; const t = it.m.svc+"|"+itemTech(it); cT[t] = (cT[t]||0)+1; }
  let html = "", g0 = null, t0 = null, n = 0;
  for(const it of sorted){

    const g = it.m.svc, t = g+"|"+itemTech(it), sec = SVC[g];
    if(g !== g0){ g0 = g; t0 = null; html += `<div class="grp-tl"><b>${esc(sec.name)}</b>${sec.tl ? " · TL " + esc(sec.tl) : ""} <span class="z">· ${cG[g]}</span></div>`; }
    if(t !== t0){ t0 = t; html += `<div class="grp">${esc(itemTech(it) || "Sans technicien")}${roleBadge(techRole(g, itemTech(it)))}${matTag(itemTech(it))} <span class="z">· ${cT[t]}</span></div>`; }
    html += itemRow(it); n++;
  }
  const more = sorted.length > n ? `<div class="more"><button class="btn" data-act="expand" data-id="${id}">Afficher les ${sorted.length} interventions</button></div>` : "";
  const fk = "al-" + id, folded = isFolded(fk);

    <div class="panel-h"><h2>${esc(title)}<span class="c">${arr.length}</span></h2><div class="tools">${note && !folded ? `<span class="note">${note}</span>` : ""}${folded ? "" : opts.tools || ""}${foldBtn(fk, folded)}</div></div>
    ${folded ? "" : `<div class="list">${html || `<div class="empty">${esc(opts.empty || "Rien à signaler.")}</div>`}</div>${more}`}
  </div>`;

function renderAlertes(D){
  const its = D.items.filter(it => matchIt(it));
  const late = its.filter(it => it.st === "retard");
  const wk = its.filter(it => it.ew === CW && it.st !== "suspendu" && it.st !== "hors");
  const wkDone = wk.filter(it => it.st === "fait").length;
  const nx = its.filter(it => it.ew === CW+1 && it.st !== "suspendu");
  const due = its.filter(it => isDue(it, D)), dueDone = due.filter(it => it.st === "fait").length;
  const rate = pct(dueDone, due.length);
  const oldest = late.reduce((a,b) => !a || b.ew < a.ew ? b : a, null);
  let alarm;
  if(late.length) alarm = `<div class="alarm"><b>${late.length} préventif${late.length>1?"s":""} en retard</b><span>Le plus ancien : ${esc(oldest.m.num)} (${esc(SVC[oldest.m.svc].name)}), prévu en S${oldest.ew}</span><button class="btn" data-act="goto" data-id="p-late">Voir la liste</button></div>`;
  else if(wk.length && wkDone === wk.length) alarm = `<div class="alarm ok"><b>Tout est à jour</b><span>Les ${wk.length} préventifs de la S${CW} sont faits.</span></div>`;
  else alarm = `<div class="alarm ok"><b>Aucun retard</b><span>${wk.length - wkDone} préventif${wk.length-wkDone>1?"s":""} à faire cette semaine.</span></div>`;

  const kpis = `<div class="kpis">
    <div class="kpi" style="--c:var(--late)"><div class="k">En retard</div><div class="v">${late.length}</div><div class="s">non faits, depuis S${D.start}</div></div>
    <div class="kpi" style="--c:var(--week-solid)"><div class="k">Cette semaine · S${CW}</div><div class="v">${wk.length - wkDone}</div><div class="s">à faire · ${wkDone} / ${wk.length} faits</div><div class="meter"><i style="width:${pct(wkDone,wk.length)||0}%"></i></div></div>
    <div class="kpi" style="--c:var(--next)"><div class="k">Semaine prochaine · S${CW+1}</div><div class="v">${nx.filter(i=>i.st!=="fait").length}</div><div class="s">à préparer · ${esc(CW+1 <= NWEEKS ? weekRange(CW+1) : "—")}</div></div>
    <div class="kpi" style="--c:var(--done)"><div class="k">Réalisation S${D.start} → S${Math.min(CW,NWEEKS)}</div><div class="v">${rate == null ? "—" : rate+" %"}</div><div class="s">${dueDone} faits sur ${due.length} dus</div><div class="meter"><i style="width:${rate||0}%"></i></div></div>
  </div>`;

  // vue d'ensemble : section, puis techniciens A·S·T et techniciens M
  const row = (cls, label, nMach, list, act) => {
    const st = statsOf(list, D);
    return `<tr class="${cls}" ${act}><td>${cls === "sv" ? `<b>${esc(label)}</b>` : esc(label)}</td><td class="r num">${nMach}</td><td class="r num ${st.late?"lateN":"z"}">${st.late}</td><td class="r num">${st.wkOpen}</td><td class="r num">${st.wkDone} / ${st.wk}</td><td><div class="rate" style="--c:var(--done)"><div class="meter"><i style="width:${st.rate||0}%"></i></div><span>${st.rate==null?"—":st.rate+"%"}</span></div></td></tr>`;
  };
  let rows = "";
  for(const sv of SECTIONS){
    const sm = machines.filter(m => m.svc === sv.id && matchM(m));
    if(!sm.length) continue;
    const sIt = its.filter(it => it.m.svc === sv.id);
    rows += row("sv", sv.name + (sv.tl ? " · TL " + sv.tl : ""), sm.length, sIt, `data-act="svc" data-svc="${sv.id}"`);
    if(sm.some(m => m.chef)){
      const a = sIt.filter(isAstItem), b = sIt.filter(it => !isAstItem(it));
      rows += row("tlr", `Techniciens A·S·T (${uniq(sm.map(m => m.chef)).length})`, "", a, "");
      rows += row("tlr", `Techniciens M (${uniq(sm.map(m => m.tech)).length})`, "", b, "");
    }
  }
  const stFold = isFolded("al-sections");
  const svcTable = `<div class="panel"><div class="panel-h"><h2>Par section</h2>${stFold ? "" : `<span class="note">A·S·T = annuel, semestriel, trimestriel · M = mensuel · cliquez sur une section pour filtrer</span>`}<div class="tools">${foldBtn("al-sections", stFold)}</div></div>${stFold ? "" : `<div class="scroll"><table class="t"><thead><tr><th>Section / techniciens</th><th class="r">Machines</th><th class="r">En retard</th><th class="r">À faire S${CW}</th><th class="r">Faits S${CW}</th><th>Réalisation</th></tr></thead><tbody>${rows}</tbody></table></div>`}</div>`;

  const wkShown = S.hideDone ? wk.filter(it => it.st !== "fait") : wk;
  const hideBtn = `<button class="btn" data-act="print">Imprimer (A4)</button><button class="btn" data-act="hidedone">${S.hideDone ? "Afficher les faits" : "Masquer les faits"}</button>`;
  const repBtn = `${canPlan() && (late.length || wk.some(it => it.st === "semaine")) ? `<button class="btn pri" data-act="report">Envoyer retards + semaine (WhatsApp / e-mail)</button>` : ""}${notifSupported() && !notifOn() && Notification.permission !== "denied" ? `<button class="btn" data-act="notifon">Activer les notifications</button>` : ""}`;
  $("#v-alertes").innerHTML = alarm + kpis + svcTable +
    listPanel("p-late", "En retard", `Planifiés avant S${CW}, non faits`, late, {empty:"Aucun préventif en retard.", tools:repBtn}) +
    listPanel("p-week", `Cette semaine · S${CW}`, esc(CW<=NWEEKS?weekRange(CW):""), wkShown, {empty: wk.length ? "Tous les préventifs de la semaine sont faits." : "Aucun préventif planifié cette semaine.", tools:hideBtn}) +
    listPanel("p-next", `Semaine prochaine · S${CW+1}`, "À préparer : pièces, disponibilité machine", nx, {empty:"Aucun préventif planifié la semaine prochaine."});
}

function renderPlanning(D){
  const gw0 = document.querySelector("#v-planning .grid-wrap");

  const weeks = Array.from({length:NWEEKS}, (_,i) => i+1);

    const fo = focusItem(m), onAst = !!fo && isAstItem(fo), onM = !!fo && !isAstItem(fo);
    const pact = who => ed ? `data-act="medit" data-mid="${esc(m.id)}"` : who ? `data-act="whoplan" data-who="${esc(who)}"` : "";
    let row = `<tr class="${susp?"susp":""}"><th class="pc pc-m" data-act="${ed?"medit":"machine"}" data-mid="${esc(m.id)}" title="${esc(m.num+" · "+m.type+" · "+(m.proj||"")+(susp?" · "+ETATS[et.k]+" S"+et.since:"")+(m.added?" · ajoutée par un responsable":""))}"><b>${m.added?`<span class="plus">+</span>`:""}${esc(m.num)}</b><span>${esc(m.type)}</span></th>`
      + `<td class="pc pc-p pc-tl" ${ed ? pact("") : `data-act="svc" data-svc="${esc(m.svc)}"`} title="${esc("TL : " + (sec.tl || "non renseigné"))}">${esc(sec.tl || "—")}</td>`
      + `<td ${pact(m.chef || m.tech)} title="${esc("Technicien A·S·T (annuel, semestriel, trimestriel) : " + chefName + (m.chef ? "" : " (même technicien)") + (onAst ? focusTxt(fo) : ""))}" class="pc pc-p pc-ch${m.chef ? "" : " same"}${onAst ? " tech-on" : ""}">${esc(chefName)}</td>`

    for(const w of weeks){

function machineStats(m, D){
  const a = m._items;
  const due = a.filter(it => isDue(it, D));
  const next = a.filter(it => it.st !== "fait" && it.st !== "suspendu" && it.ew >= CW).sort((x,y) => x.ew - y.ew)[0];
  return {done: a.filter(it => it.st === "fait").length, late: a.filter(it => it.st === "retard").length, due: due.length, dueDone: due.filter(it => it.st === "fait").length, next, total: a.length};
}

function renderEquipes(D){
  const ms = machines.filter(m => matchM(m));
  const stat = (l, n, cls) => `<div class="stat"><div class="l">${esc(l)}</div><div class="n ${cls||""}">${n}</div></div>`;
  const pl = (n, w) => n + " " + w + (n > 1 ? "s" : "");
  const SHOWN = ["late", "week", "done"]; // vue allégée : seulement ce qui demande une action ou vient d'être fait
  const leg = SHOWN.map(k => `<span class="mchip ms-${k}">${esc(MS_LABEL[k])}</span>`).join("");
  const its = D.items.filter(it => matchIt(it));
  let html = `<div class="mgr-line"><span class="eyebrow">Manager maintenance</span><b>${esc(mgrName())}</b></div><div class="eq-top"><div class="legend">${leg}</div><div class="tools" style="display:flex;gap:6px">${canOrg() || orgSecs().size ? `<button class="btn" data-act="mats">Matricules</button>` : ""}<button class="btn" data-act="foldall" data-v="0">Tout déplier</button><button class="btn" data-act="foldall" data-v="1">Tout réduire</button></div></div>`;
  if(!ms.length) html += `<div class="panel"><div class="empty">Aucune machine ne correspond aux filtres.</div></div>`;
  for(const sec of SECTIONS){
    const sm = ms.filter(m => m.svc === sec.id);
    if(!sm.length) continue;
    const sIt = its.filter(it => it.m.svc === sec.id), ss = statsOf(sIt, D), two = sm.some(m => m.chef);
    const groups = two
      ? [["ast", "Techniciens A·S·T", "Annuel · Semestriel · Trimestriel", sIt.filter(isAstItem)], ["m", "Techniciens M", "Mensuel", sIt.filter(it => !isAstItem(it))]]
      : [["all", "Techniciens", "Tous les préventifs", sIt]];
    html += `<div class="svc-band"><h2>${esc(sec.name)}</h2><span class="meta">TL : <b>${esc(sec.tl || "non renseigné")}</b> · ${two ? `${pl(uniq(sm.map(m => m.chef)).length, "technicien")} A·S·T · ${pl(uniq(sm.map(m => m.tech)).length, "technicien")} M` : pl(uniq(sm.map(m => m.tech)).length, "technicien")} · ${pl(sm.length, "machine")}</span>
      <div class="k"><span>En retard<b>${ss.late}</b></span><span>À faire S${CW}<b>${ss.wkOpen}</b></span><span>Faits S${CW}<b>${ss.wkDone}/${ss.wk}</b></span><span>Réalisation<b>${ss.rate==null?"—":ss.rate+" %"}</b></span></div></div><div class="teams">`;
    for(const [gk, title, sub, list] of groups){
      const st = statsOf(list, D), fk = sec.id + "|" + gk, folded = !!S.fold[fk];
      const byTech = new Map();
      for(const it of list){ const t = itemTech(it); if(!byTech.has(t)) byTech.set(t, []); byTech.get(t).push(it); }
      html += `<article class="tl ${folded?"":"open"}"><header class="tl-h">
        <div><div class="eyebrow">${esc(sec.name)} · ${esc(sub)}</div><h3>${esc(title)}</h3><div class="tl-sub">${pl(byTech.size, "technicien")}</div></div>
        <div class="tl-k">${stat("En retard", st.late, st.late?"late":"")}${stat("À faire S"+CW, st.wkOpen)}${stat("Faits S"+CW, st.wkDone+" / "+st.wk)}${stat("Réalisation", st.rate==null?"—":st.rate+" %")}</div>
        <div class="tl-act"><button class="btn" data-act="fold" data-key="${esc(fk)}" aria-expanded="${!folded}">${folded?"Afficher":"Réduire"}</button></div>
      </header>`;
      if(!folded){
        let body = "";
        for(const [tech, tIt] of [...byTech.entries()].sort((a,b) => a[0].localeCompare(b[0], "fr"))){
          const mine = sm.filter(m => (gk === "ast" ? m.chef : m.tech) === tech || (gk === "all" && m.tech === tech));
          const shown = mine.filter(m => SHOWN.includes(mStateFor(m, tech)));
          if(!shown.length) continue; // technicien sans rien cette semaine : pas affiché
          const ts = statsOf(tIt, D);
          body += `<div class="tech-row"><div class="tech-id">${tech ? `<button class="lk" data-act="who" data-who="${esc(tech)}">${esc(tech)}</button>${matTag(tech)}` : `<b>Sans technicien</b>`}
            <div class="m">${pl(mine.length, "machine")}${ts.late ? ` · <span class="lateN">${ts.late} en retard</span>` : ""} · ${ts.wkOpen} à faire S${CW}${ts.rate!=null ? ` · ${ts.rate} %` : ""}</div></div>
            <div class="chips">${shown.map(m => chipFor(m, tech)).join("")}</div></div>`;
        }
        if(body) html += `<div class="tl-body">${body}</div>`;
      }
      html += `</article>`;
    }
    html += `</div>`;
  }
  $("#v-equipes").innerHTML = html;
}

function tlGroups(svcs){ // sections qui ont exactement les mêmes TL : un seul encadré TL pour toutes
  const groups = new Map();
  for(const sv of svcs){
    const key = sv.tls.map(t => norm(t.name).trim()).sort().join("|");
    if(!groups.has(key)) groups.set(key, {tls: [], secs: []});
    const g = groups.get(key);
    g.secs.push(sv);
    for(const t of sv.tls){
      let e = g.tls.find(x => norm(x.name).trim() === norm(t.name).trim());
      if(!e) g.tls.push(e = {name: t.name, shifts: []});
      if(t.shift && !e.shifts.includes(t.shift)) e.shifts.push(t.shift);
    }
  }
  return [...groups.values()];
}

async function writeOrg(mut, txt){

  const o = clone(S.org) || {};

  if(S.mode === "local"){ S.org = o; saveLocalAll(); buildMachines(); scheduleRender(); return true; }
  try{ await S.db.doc("config/org").set(o); return true; }
  catch(e){ toast("Affectation non enregistrée (" + ((e && e.code) || "erreur") + ").", "late"); return false; }
}

    output_config: {effort: "medium", format: {type: "json_schema", schema: AI_STD_SCHEMA}},
    system: AI_STD_SYSTEM,
    messages: [{role: "user", content: [...blocks, {type: "text", text: ask}]}]

  if(msg.stop_reason === "refusal") throw Object.assign(new Error("Refus"), {code: "refusal"});
  if(msg.stop_reason === "max_tokens") throw Object.assign(new Error("Réponse coupée"), {code: "max_tokens"});
  const out = JSON.parse(msg.content.filter(b => b.type === "text").map(b => b.text).join(""));
  const u = msg.usage || {}, cost = ((u.input_tokens || 0) * 4 + (u.output_tokens || 0) * 20) / 1e6; // tarif Claude Opus 5.5 : 4 $ / 20 $ par million de jetons
  return {draft: out.preventifs || {}, remarques: out.remarques || "", notes, cost};

function aiErrMsg(e){

  if(c === "geo") return "L'IA gratuite de Google n'est pas disponible depuis ce pays.";
  if(gem && st === 429) return "Limite gratuite de Google atteinte : réessayez dans une minute (ou demain si c'est la limite du jour).";
  if(gem && (st === 404 || st >= 500)) return "Aucun modèle Google disponible pour le moment : réessayez plus tard.";
  if(c === "no_input") return "Choisissez un document ou collez le texte du standard.";
  if(c === "offline" || (e instanceof TypeError && /fetch|network/i.test(e.message || ""))) return "Connexion à l'IA impossible : vérifiez internet puis réessayez.";
  if(c === "refusal") return "L'IA a refusé de traiter ce document.";
  if(c === "max_tokens") return "Le standard est trop long pour une seule lecture : envoyez-le en plusieurs parties.";
  if(st === 401) return "Clé API refusée : vérifiez-la (bouton « Changer la clé »).";
  if(!gem && (st === 402 || (e && /credit|billing/i.test(e.message || "")))) return "Crédit API insuffisant : ajoutez du crédit sur console.anthropic.com.";
  if(st === 413) return "Document trop lourd (32 Mo au plus par envoi).";
  if(st === 429) return "Trop de demandes : réessayez dans une minute.";
  if(st >= 500) return "Service IA indisponible pour le moment : réessayez plus tard.";
  if(e instanceof SyntaxError) return "Réponse de l'IA illisible : réessayez.";

async function helperSend(text){

    hpSave(); renderHelper(); return;
  }
  HP.msgs.push({role: "user", content: text}); HP.busy = true; hpSave(); renderHelper();
  try{
    const key = await aiKeyNeed();
    const hist = HP.msgs.filter(x => !x.err).slice(-20);
    while(hist.length && hist[0].role !== "user") hist.shift();
    const show = t => { const live = $("#hp-live"); if(live){ live.innerHTML = hpFmt(t); const b = $("#hp-msgs"); b.scrollTop = b.scrollHeight; } };
    let out = "";
    if(aiProv(key) === "gemini"){
      const g = await geminiCall(key, {systemInstruction: {parts: [{text: HELPER_SYSTEM + "\n\nContexte de la conversation :\n" + helperContext()}]},
        contents: hist.map(x => ({role: x.role === "assistant" ? "model" : "user", parts: [{text: x.content}]})),
        generationConfig: {maxOutputTokens: 16384}}, show);
      out = g.text;
      if(!out.trim() && (g.block || /SAFETY|PROHIBITED|BLOCKLIST/.test(g.fin))) out = "Je ne peux pas répondre à cette question.";
    } else {
      const client = await aiClient(key);
      const stream = client.beta.messages.stream({
        model: AI_MODEL, max_tokens: 8000,
        betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
        output_config: {effort: "medium"},
        system: [{type: "text", text: HELPER_SYSTEM}, {type: "text", text: "Contexte de la conversation :\n" + helperContext()}],
        messages: hist.map(x => ({role: x.role, content: x.content}))

      for await (const ev of stream){
        if(ev.type === "content_block_delta" && ev.delta.type === "text_delta"){ out += ev.delta.text; show(out); }
      }
      const msg = await stream.finalMessage();
      if(msg.stop_reason === "refusal" && !out.trim()) out = "Je ne peux pas répondre à cette question.";

  if(HP.open){ renderHelper(); const i = $("#hp-in"); if(i) i.focus(); }
}

const niceMax = v => { if(v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m * p >= v) return m * p; return 10 * p; };
const WK_KEYS = [["fait","Fait","--c-done"], ["retard","En retard","--c-late"], ["afaire","À faire cette semaine","--c-week"], ["plan","Planifié","--c-plan"], ["hors","Avant le suivi","--c-hors"]];
function weekChart(its){
  const W = 1040, H = 250, padL = 40, padR = 14, padT = 28, padB = 28, n = NWEEKS;
  const slot = (W - padL - padR) / n, bw = Math.min(24, Math.max(6, slot * 0.68)), ph = H - padT - padB;
  const wk = Array.from({length:n + 1}, () => ({fait:0, retard:0, afaire:0, plan:0, hors:0}));
  const totals = {fait:0, retard:0, afaire:0, plan:0, hors:0};
  for(const it of its){
    if(it.st === "suspendu" || it.ew < 1 || it.ew > n) continue;
    const k = it.st === "fait" ? "fait" : it.st === "retard" ? "retard" : it.st === "semaine" ? "afaire" : it.st === "hors" ? "hors" : "plan";
    wk[it.ew][k]++; totals[k]++;
  }
  const tot = w => WK_KEYS.reduce((a, [k]) => a + wk[w][k], 0);
  let max = 0; for(let w = 1; w <= n; w++) max = Math.max(max, tot(w));
  const top = niceMax(max), y = v => padT + ph * (1 - v / top);
  let g = "";
  for(const t of [0, top / 2, top]) g += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${padL - 8}" y="${y(t) + 4}" class="ax" text-anchor="end">${Math.round(t)}</text>`;
  for(let w = 1; w <= n; w++){
    const x = padL + slot * (w - 0.5) - bw / 2;
    const segs = WK_KEYS.filter(([k]) => wk[w][k] > 0);
    let base = y(0);
    segs.forEach(([k, , c], i) => {
      const h = ph * wk[w][k] / top, tp = base - h, last = i === segs.length - 1;
      const hh = Math.max(0, h - (last ? 0 : 2)); // 2px de fond entre deux segments
      if(hh > 0.3){
        if(last){ const r = Math.min(4, hh / 2, bw / 2); g += `<path d="M${x},${base} V${tp + r} Q${x},${tp} ${x + r},${tp} H${x + bw - r} Q${x + bw},${tp} ${x + bw},${tp + r} V${base} Z" style="fill:var(${c})"/>`; }
        else g += `<rect x="${x}" y="${tp + 2}" width="${bw}" height="${hh}" style="fill:var(${c})"/>`;
      }
      base = tp;
    });
    const near = Math.abs(w - CW) <= 2 && w !== CW;
    if((w === 1 || w % 4 === 1 || w === CW) && !near) g += `<text x="${padL + slot * (w - 0.5)}" y="${H - 8}" class="ax${w === CW ? " cw" : ""}" text-anchor="middle">S${w}</text>`;
  }
  if(CW >= 1 && CW <= n){
    const cx = padL + slot * (CW - 0.5), anchor = cx > W - 90 ? "end" : cx < 90 ? "start" : "middle";
    g += `<line x1="${cx}" x2="${cx}" y1="${padT - 12}" y2="${H - padB}" class="cwl"/><text x="${cx}" y="${padT - 16}" class="cwt" text-anchor="${anchor}">Aujourd'hui · S${CW}</text>`;
  }
  for(let w = 1; w <= n; w++) g += `<rect x="${padL + slot * (w - 1)}" y="${padT}" width="${slot}" height="${ph}" class="hit"><title>${esc(`S${w} · ${weekRange(w)}\n` + WK_KEYS.map(([k, l]) => `${l} : ${wk[w][k]}`).join("\n"))}</title></rect>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Préventifs par semaine et par statut">${g}</svg>`, totals};
}

function buildReport(){ // en retard + à faire cette semaine ; une partie vide n'est pas écrite ; chaîne vide s'il n'y a rien
  const D = S.D, its = D.items.filter(it => matchIt(it));
  const late = its.filter(it => it.st === "retard"), wk = its.filter(it => it.st === "semaine");
  if(!late.length && !wk.length) return "";
  const pl = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`, nm = a => new Set(a.map(it => it.m.id)).size;
  const si = {}; SECTIONS.forEach((x, i) => { si[x.id] = i; });
  const L = [];
  L.push(`PRÉVENTIFS — S${CW} (${CW<=NWEEKS?weekRange(CW):""} ${YEAR})`);
  const part = (title, arr, line) => {
    if(!arr.length) return;
    L.push("", `▶ ${title} : ${pl(arr.length, "préventif")} sur ${pl(nm(arr), "machine")}`);
    const all = arr.slice().sort((a,b) => (si[a.m.svc] ?? 99) - (si[b.m.svc] ?? 99) || itemTech(a).localeCompare(itemTech(b), "fr") || a.ew - b.ew || a.m.num.localeCompare(b.m.num,"fr",{numeric:true}));
    let g0 = null, t0 = null;
    for(const it of all){
      const g = it.m.svc, t = g + "|" + itemTech(it);
      if(g !== g0){ g0 = g; t0 = null; L.push(`══ ${SVC[g].name.toUpperCase()}${SVC[g].tl ? " (TL : " + SVC[g].tl + ")" : ""}`); }
      if(t !== t0){ t0 = t; const r = techRole(g, itemTech(it)); L.push(`  ■ ${(itemTech(it) || "Sans technicien").toUpperCase()}${r ? " (" + r + ")" : ""}`); }
      L.push(line(it));
    }
  };
  const proj = it => it.m.proj ? " — " + it.m.proj : "";
  part("EN RETARD", late, it => `     - ${it.m.num} (${it.m.type}) — ${TYPES[it.code]} — prévu S${it.ew}${proj(it)}`);
  part(`À FAIRE CETTE SEMAINE (S${CW})`, wk, it => `     - ${it.m.num} (${it.m.type}) — ${TYPES[it.code]}${proj(it)}`);
  return L.join("\n");
}

  await writeMod(u.mid, {sem:{["S"+u.w]: {v:u.prev, old:cur, at:new Date().toISOString()}}});
  scheduleRender();
}

/* ---------- Norme du planning de chaque section ----------
   Relevée sur le fichier Excel : cycle annuel A M M T M M S M M T M M, un préventif toutes les 4 à 5 semaines
   (semaines de congé exclues), D (démarrage) à la place du A pour une machine neuve, H chaque autre semaine au surmoulage. */
const NORM_CYCLE = ["A","M","M","T","M","M","S","M","M","T","M","M"];
function sectionNorm(svc){
  const ms = machines.filter(m => m.svc === svc), pool = ms.length ? ms : machines;
  const nW = ms.length ? Math.max(...ms.map(m => m.w.length)) : 52;
  const conge = [];
  for(let w = 1; w <= nW; w++) if(pool.filter(m => m.w[w - 1] === "C").length > pool.length / 2) conge.push(w);
  const hebdo = ms.length > 0 && ms.filter(m => (m.w.match(/H/g) || []).length >= 10).length > ms.length / 2;
  return {nW, conge, hebdo};
}
function normSchedule(svc, startW, first){
  const nz = sectionNorm(svc), cg = new Set(nz.conge), avail = [];
  for(let w = 1; w <= nz.nW; w++) if(!cg.has(w)) avail.push(w);
  const codes = {}, step = avail.length / 12, i0 = avail.findIndex(w => w >= startW), k0 = first === "M" ? 1 : 0;
  if(i0 >= 0) for(let k = 0; ; k++){
    const idx = i0 + Math.round(k * step);
    if(idx >= avail.length) break;
    codes[avail[idx]] = k === 0 && first === "D" ? "D" : NORM_CYCLE[(k0 + k) % 12];
  }
  for(const w of nz.conge) codes[w] = "C";
  if(nz.hebdo && i0 >= 0) for(const w of avail) if(w >= startW && !codes[w]) codes[w] = "H";
  return {codes, nz};
}
function bestStart(svc, first){ // parmi les 4 prochaines semaines, celle qui charge le moins la section
  const nz = sectionNorm(svc), load = {};
  for(const m of machines) if(m.svc === svc) for(let i = 0; i < m.w.length; i++) if("AMTSD".includes(m.w[i])) load[i + 1] = (load[i + 1] || 0) + 1;
  let best = null;
  for(let w = Math.max(1, CW + 1); w <= Math.min(CW + 4, nz.nW); w++){
    const {codes} = normSchedule(svc, w, first);
    const sc = Object.keys(codes).filter(k => "AMTSD".includes(codes[k])).reduce((a, k) => a + (load[k] || 0), 0);
    if(!best || sc < best.sc) best = {w, sc};
  }
  return best ? best.w : Math.min(nz.nW, Math.max(1, CW));
}
function normText(svc){
  const nz = sectionNorm(svc), every = ((nz.nW - nz.conge.length) / 12).toFixed(1).replace(".", ",");
  return `Norme du planning : cycle annuel A · M · M · T · M · M · S · M · M · T · M · M, un préventif toutes les ~${every} semaines${nz.conge.length ? ", congé S" + nz.conge.join(" et S") : ", sans congé"}${nz.hebdo ? ", contrôle hebdomadaire (H) les autres semaines" : ""}. Machine neuve : D (démarrage) à la place du A.`;
}
function autoFieldset(){
  const wk = Array.from({length:NWEEKS}, (_, i) => i + 1);
  return `<fieldset class="rep" id="auto-fs"><legend>Préventifs automatiques</legend>
    <label class="chk"><input type="checkbox" id="a-on" checked> Planifier les préventifs selon la norme de la section</label>
    <div class="row2">
      <label class="field">Premier préventif<select id="a-first"><option value="D">Démarrage (D) · machine neuve</option><option value="A">Annuel (A)</option><option value="M">Mensuel (M)</option></select></label>
      <label class="field">Semaine du premier préventif<select id="a-start">${wk.map(w => `<option value="${w}">S${w} · ${esc(weekRange(w))}</option>`).join("")}</select></label>
    </div>
    <p class="z" id="a-norm" style="margin:0;font-size:13px"></p>
    <div class="strip" id="a-prev" aria-label="Aperçu des préventifs de l'année"></div>

/* ---------- Planning de l'année suivante (proposition) ----------
   Comme cette année : une machine régulière garde exactement ses semaines (sa « vague », premier préventif en S1 à S4)
   et la suite de son cycle A M M T M M S M M T M M. Une machine nouvelle, à l'année incomplète, ou qui ne peut pas garder
   ses semaines (moins de 3 ou plus de 6 semaines après son dernier préventif) rejoint la vague compatible qui charge le
   moins la section. Les congés restent aux mêmes semaines. */
const isoWeeksIn = y => isoWeekOf(new Date(y, 11, 28)).w; // la semaine du 28 décembre est la dernière de l'année
function cyclePos(codes){ // place (0 à 11) du dernier préventif dans le cycle ; D (démarrage) compte comme A
  const s = codes.map(c => c === "D" ? "A" : c);
  if(!s.length) return -1;
  let best = null;
  for(let o = 0; o < 12; o++){
    let sc = 0; s.forEach((c, i) => { if(NORM_CYCLE[(o + i) % 12] === c) sc += 1 + i / s.length; }); // les derniers comptent plus
    if(!best || sc > best.sc) best = {o, sc};
  }
  return (best.o + s.length - 1) % 12;
}
function nextYearPlan(secIds){
  const Y = YEAR + 1, NW = isoWeeksIn(Y), NW0 = isoWeeksIn(YEAR), res = {year: Y, nW: NW, w: {}, sec: []};
  for(const sec of SECTIONS.filter(x => !secIds || secIds.includes(x.id))){
    const ms = machines.filter(m => m.svc === sec.id && !isOut(m));
    if(!ms.length) continue;
    const cg0 = new Set(sectionNorm(sec.id).conge), set = ((((S.org || {}).conges) || {})[Y] || {})[sec.id]; // congés : cette année / l'an prochain (saisis par l'admin ou le TL)
    const cg = new Set(Array.isArray(set) ? set.filter(w => w >= 1 && w <= NW) : [...cg0].filter(w => w <= NW));
    const prevs = m => [...m.w].map((c, i) => [i + 1, c]).filter(([, c]) => "AMTSD".includes(c));
    const gapIn = (a, b, off) => { let g = 0; for(let w = a + 1; w <= b; w++) if(!off.has(w)) g++; return g; };
    const regular = m => { const p = prevs(m); if(p.length < 12 || p[0][0] > 6) return false; for(let i = 1; i < p.length; i++){ const g = gapIn(p[i - 1][0], p[i][0], cg0); if(g < 3 || g > 6) return false; } return true; };
    const fits = ws => ws.every((w, i) => !cg.has(w) && (!i || (gapIn(ws[i - 1], w, cg) >= 3 && gapIn(ws[i - 1], w, cg) <= 6))); // ses semaines restent valables avec les congés de l'an prochain
    const avail = []; for(let w = 1; w <= NW; w++) if(!cg.has(w)) avail.push(w); // semaines travaillées
    const load = new Array(NW + 1).fill(0), l0 = new Array(NW0 + 1).fill(0), notes = [];
    for(const m of ms) for(const [w] of prevs(m)) if(w <= NW0) l0[w]++;
    const gapFrom = (m, f) => { const p = prevs(m); return p.length ? NW0 - p[p.length - 1][0] + f : null; }; // semaines entre son dernier préventif et le premier de l'an prochain
    const write = (m, ws) => { // codes : la suite de son cycle
      const pos = cyclePos(prevs(m).map(x => x[1])), w = Array(NW).fill(".");
      ws.forEach((x, k) => { w[x - 1] = NORM_CYCLE[(pos + 1 + k) % 12]; });
      if((m.w.match(/H/g) || []).length >= 10) for(let x = 1; x <= NW; x++) if(w[x - 1] === "." && !cg.has(x)) w[x - 1] = "H";
      for(const x of cg) w[x - 1] = "C";
      res.w[m.id] = w.join("");
      return w;
    };
    const paths = new Map(), put = (ws, d) => ws.forEach(x => { load[x] += d; }), later = [];
    for(const m of ms){ // 1) comme cette année
      const own = prevs(m).map(x => x[0]).filter(w => w <= NW), g = own.length ? gapFrom(m, own[0]) : null;
      if(regular(m) && g >= 3 && g <= 6 && fits(own)){ paths.set(m, own); put(own, 1); } else later.push(m);
    }
    const why = m => { const p = prevs(m);
      if(m.added && p.length < 12) return "nouvelle machine";
      if(!p.length) return "aucun préventif cette année";
      if(m._etat && m._etat.k === "arret") return "en arrêt cette année";
      if(p.length < 12) return "année incomplète (" + p.length + " préventifs)";
      if(!fits(p.map(x => x[0]).filter(w => w <= NW))) return "congés " + Y + " sur ses semaines";
      return "ses semaines ne suivent pas son dernier préventif"; };
    const firsts = m => { // premier préventif possible : 3 à 6 semaines après le dernier de cette année
      const ok = avail.filter(w => w <= 6 && (gapFrom(m, w) == null || (gapFrom(m, w) >= 3 && gapFrom(m, w) <= 6)));
      return ok.length ? ok : avail.filter(w => w <= 4); // dernier préventif trop loin : reprise dès le début de l'année
    };
    const path = m => { // 12 préventifs espacés de 4 ou 5 semaines travaillées, par les semaines les moins chargées
      const n = avail.length, K = 12, INF = 1e9, mine = new Set(prevs(m).map(x => x[0]));
      const c = w => (load[w] + 1) * (load[w] + 1) - (mine.has(w) ? 0.01 : 0); // une semaine déjà chargée coûte beaucoup plus ; à égalité, ses semaines de cette année
      for(const gaps of [[4, 5], [3, 4, 5, 6]]){
        const cost = Array.from({length: K}, () => new Array(n).fill(INF)), from = Array.from({length: K}, () => new Array(n).fill(-1));
        for(const w of firsts(m)) cost[0][avail.indexOf(w)] = c(w);
        for(let k = 1; k < K; k++) for(let i = 0; i < n; i++) if(cost[k - 1][i] < INF) for(const g of gaps){
          const j = i + g; if(j < n && cost[k - 1][i] + c(avail[j]) < cost[k][j]){ cost[k][j] = cost[k - 1][i] + c(avail[j]); from[k][j] = i; }
        }
        let best = -1;
        for(let j = 0; j < n; j++) if(avail[j] >= NW - 5 && cost[K - 1][j] < INF && (best < 0 || cost[K - 1][j] < cost[K - 1][best])) best = j; // le dernier en fin d'année (au plus 6 semaines avant le premier de l'année d'après)
        if(best < 0) continue;
        const ws = []; for(let k = K - 1, j = best; k >= 0; j = from[k][j], k--) ws.unshift(avail[j]);
        return ws;
      }
      return firsts(m).slice(0, 1);
    };
    later.sort((a, b) => firsts(a).length - firsts(b).length); // les plus contraintes d'abord
    for(const m of later){ const ws = path(m); paths.set(m, ws); put(ws, 1); } // 2) les semaines les moins chargées
    for(let pass = 0; pass < 3; pass++) for(const m of later){ put(paths.get(m), -1); const ws = path(m); paths.set(m, ws); put(ws, 1); } // puis chacune revoit sa place en tenant compte des autres
    const st = (l, n, off = cg) => { const v = []; for(let x = 1; x <= n; x++) if(!off.has(x)) v.push(l[x] || 0); return {avg: v.reduce((a, b) => a + b, 0) / Math.max(1, v.length), max: Math.max(0, ...v), min: Math.min(...v)}; };
    const moved = new Set(later);
    for(let pass = 0; pass < 3; pass++){ // 3) section encore déséquilibrée : une machine change de semaines seulement si cela retire vraiment un pic
      const s = st(load, NW); if(s.max - s.min <= Math.max(2, s.avg * 0.2)) break;
      const need = Math.max(3, s.avg * 0.5), mc = ws => ws.reduce((a, x) => a + 2 * load[x] + 1, 0);
      for(const m of ms){
        const cur = paths.get(m); put(cur, -1);
        const cand = path(m);
        if(mc(cur) - mc(cand) >= need){ paths.set(m, cand); put(cand, 1); moved.add(m); } else put(cur, 1);
      }
    }
    for(const m of ms){
      const w = write(m, paths.get(m));
      if(moved.has(m)) notes.push({m, why: later.includes(m) ? why(m) : "décalée pour équilibrer la charge", first: w.findIndex(x => "AMTSD".includes(x)) + 1, code: w.find(x => "AMTSD".includes(x))});
    }
    const nW0s = Math.max(0, ...ms.filter(m => BASE_BY_ID[m.id]).map(m => BASE_BY_ID[m.id].w.length)) || NW0; // colonnes du planning Excel de la section
    res.sec.push({id: sec.id, name: sec.name, n: ms.length, same: ms.length - moved.size, notes, conge: [...cg], before: st(l0, nW0s, cg0), after: st(load, NW), load, l0});
  }
  return res;
}

/* ---------- API PRO (GMAO officielle de LEONI) : échange par fichiers ----------
   API PRO tourne sur un serveur interne (protocole Progress) : pas de lien direct depuis le navigateur. L'échange passe

const apKey = v => norm(String(v == null ? "" : v)).replace(/[\s._\-\/]+/g, ""); // « M 727 » = « m727 »

const AP_ROLES = [ // colonne d'un export API PRO → rôle (devinée d'après le titre, modifiable)

/* Dossier d'échange sur ce PC (Chrome / Edge) : relié une fois, gardé dans le navigateur ; l'application y lit le dernier

function apAnalyze(data, col){
  const cfg = apCfg(), mo = Object.assign({}, cfg.mo), ws = Object.assign({}, cfg.ws), wo = clone(cfg.wo) || {}, mine = new Set(apSecs().map(x => x.id));
  const byNum = new Map(), bySer = new Map();
  for(const m of machines){ if(!mine.has(m.svc)) continue; byNum.set(apKey(m.num), m); if(m.serie && apKey(m.serie).length >= 4) bySer.set(apKey(m.serie), m); }

  for(const r of data.rows){
    const code = String(v(r, "mo")).trim(), m = bySer.get(apKey(v(r, "serial"))) || byNum.get(apKey(v(r, "name"))) || byNum.get(apKey(code));

function apRows(ids, from, to, full){ // lignes du fichier Import_CMU.csv : préventifs faits entre deux semaines

  }

}

function sheetSection(name){
  const n = norm(name).replace(/\s+/g, " ").trim();

function parseWorkbook(X, wb){
  const res = {sheets:[], rows:[], skipped:[]};
  for(const name of wb.SheetNames){
    const svc = sheetSection(name), ws = wb.Sheets[name];
    if(!svc || !ws || !ws["!ref"]){ res.skipped.push(name); continue; }
    const ref = X.utils.decode_range(ws["!ref"]);
    const val = (r, c) => { const cell = ws[X.utils.encode_cell({r, c})]; return cell ? xclean(cell.v) : ""; };
    const mg = new Map();
    for(const m of (ws["!merges"] || [])) for(let r = m.s.r; r <= m.e.r; r++) for(let c = m.s.c; c <= m.e.c; c++) mg.set(r + "|" + c, [m.s.r, m.s.c]);
    const mval = (r, c) => { const t = mg.get(r + "|" + c); return t ? val(t[0], t[1]) : val(r, c); };
    let wcol = -1, hrow = -1;
    for(let r = ref.s.r; r <= Math.min(ref.e.r, ref.s.r + 25) && wcol < 0; r++) for(let c = ref.s.c; c <= ref.e.c; c++) if(val(r, c) === "S1"){ wcol = c; hrow = r; break; }
    if(wcol < 0){ res.skipped.push(name + " (pas de colonne S1)"); continue; }
    let nW = 0;
    for(let c = wcol; c <= ref.e.c; c++){ const mm = /^S(\d+)$/.exec(val(hrow, c)); if(mm) nW = +mm[1]; else if(nW) break; }
    const cols = {};
    for(const lr of [hrow - 1, hrow]) if(lr >= 0) for(let c = 0; c < wcol; c++){
      const v = norm(val(lr, c)); if(!v) continue;
      if(v === "tl"){ if(cols.tl == null) cols.tl = c; }
      else if(v.includes("types des machines")){ if(cols.type == null) cols.type = c; }
      else if(v.includes("serie")){ if(cols.serie == null) cols.serie = c; }
      else if(v.includes("n° des machines") || v === "n°"){ if(cols.num == null) cols.num = c; }
      else if(v.includes("projet") || v.includes("position")){ if(cols.proj == null) cols.proj = c; }
    }
    if(cols.num == null || cols.type == null || cols.serie == null){ res.skipped.push(name + " (colonnes introuvables)"); continue; }
    const ppl = []; for(let c = 0; c < cols.num; c++) if(c !== cols.tl && c !== cols.proj) ppl.push(c);
    if(ppl.length >= 2){ cols.chef = ppl[ppl.length - 2]; cols.tech = ppl[ppl.length - 1]; } else if(ppl.length) cols.tech = ppl[0];
    const carry = {}; let n = 0;
    for(let r = hrow + 1; r <= ref.e.r; r++){
      const num = val(r, cols.num);
      if(!num || norm(num).startsWith("n°")){ if(val(r, wcol) === "S1") for(const k in carry) delete carry[k]; continue; }
      const type = val(r, cols.type), serie = val(r, cols.serie);
      if(!type && !serie) continue;
      const rec = {svc, num, type, serie};
      for(const k of ["chef", "tech", "proj"]){
        if(cols[k] == null) continue;
        let v = mval(r, cols[k]);
        if(v) carry[k] = v; else v = carry[k] || "";
        rec[k] = k === "proj" ? v.toUpperCase() : xperson(v);
      }
      let w = "";
      for(let i = 0; i < nW; i++){ const v = val(r, wcol + i).toUpperCase(); w += v.length === 1 && "MTSAHDC".includes(v) ? v : "."; }
      rec.w = w; res.rows.push(rec); n++;
    }
    res.sheets.push({name, svc, n});
  }
  return res;
}

    if(Object.keys(sem).length){ patch.sem = sem; nWeeks += Object.keys(sem).length; }

}
